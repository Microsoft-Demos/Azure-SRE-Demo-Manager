name: Infrastructure Validation and What-If

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infra-whatif.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to preview'
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev
      location:
        description: 'Azure region to preview'
        required: true
        type: string
        default: swedencentral
      parametersFile:
        description: 'Parameters file path'
        required: true
        type: string
        default: infrastructure/main.parameters.example.json

jobs:
  compile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Bicep
        run: az bicep build --file infrastructure/main.bicep

  whatif:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.AZURE_INFRA_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ADMIN_PASSWORD: WhatIfOnly-${{ github.run_id }}-Aa1!
      MCP_AUTH_TOKEN: WhatIfOnly-${{ github.run_id }}-McpToken-Aa1!
      AZURE_APP_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_APP_PRINCIPAL_OBJECT_ID }}
      SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      INPUT_ENVIRONMENT: ${{ inputs.environment }}
      INPUT_LOCATION: ${{ inputs.location }}
      INPUT_PARAMETERS_FILE: ${{ inputs.parametersFile }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate inputs and variables
        run: |
          if [[ ! "$INPUT_LOCATION" =~ ^[a-z0-9]+$ ]]; then
            echo "Location must be a canonical Azure region name"
            exit 1
          fi
          if [[ ! "$INPUT_PARAMETERS_FILE" =~ ^infrastructure/[A-Za-z0-9._/-]+\.json$ ]] || [[ "$INPUT_PARAMETERS_FILE" == *".."* ]]; then
            echo "Parameters file must be a JSON file under infrastructure/"
            exit 1
          fi
          if [ ! -f "$INPUT_PARAMETERS_FILE" ] || ! jq empty "$INPUT_PARAMETERS_FILE" 2>/dev/null; then
            echo "Parameters file is missing or invalid: $INPUT_PARAMETERS_FILE"
            exit 1
          fi
          if [ -z "$AZURE_APP_PRINCIPAL_OBJECT_ID" ] || [ -z "$SUBSCRIPTION_ID" ]; then
            echo "AZURE_APP_PRINCIPAL_OBJECT_ID and AZURE_SUBSCRIPTION_ID are required"
            exit 1
          fi

      - name: Run What-If analysis
        id: whatif
        run: |
          DEPLOYMENT_NAME="infra-whatif-$(date +%Y%m%d-%H%M%S)"

          az deployment sub what-if \
            --name "$DEPLOYMENT_NAME" \
            --location "$INPUT_LOCATION" \
            --template-file infrastructure/main.bicep \
            --parameters "$INPUT_PARAMETERS_FILE" \
            --parameters adminPassword="$ADMIN_PASSWORD" \
            --parameters mcpAuthToken="$MCP_AUTH_TOKEN" \
            --parameters applicationPrincipalId="$AZURE_APP_PRINCIPAL_OBJECT_ID" \
            --parameters environment="$INPUT_ENVIRONMENT" \
            --parameters location="$INPUT_LOCATION" \
            --subscription "$SUBSCRIPTION_ID" \
            --no-pretty-print \
            > whatif-output.txt

          cat whatif-output.txt
          echo "deployment-name=$DEPLOYMENT_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate summary
        if: always()
        run: |
          echo "## Infrastructure What-If" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment**: ${{ steps.whatif.outputs.deployment-name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment**: $INPUT_ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Location**: $INPUT_LOCATION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Subscription**: $SUBSCRIPTION_ID" >> "$GITHUB_STEP_SUMMARY"

          if [ -f whatif-output.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -n 100 whatif-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
