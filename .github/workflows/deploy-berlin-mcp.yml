name: Deploy Berlin MCP Server

on:
  push:
    branches:
      - main
    paths:
      - 'backend/berlin-mcp-server/**'
      - 'infrastructure/modules/berlin-mcp-server.bicep'
      - '.github/workflows/deploy-berlin-mcp.yml'
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
  IMAGE_NAME: berlin-mcp-server
  MCP_RESOURCE_GROUP: rg-parking-berlin-mcp-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.build.outputs.IMAGE_TAG }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

      - name: Build and push Docker image
        id: build
        working-directory: backend/berlin-mcp-server
        run: |
          IMAGE_TAG=${{ github.sha }}
          FULL_IMAGE_TAG=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          LATEST_TAG=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          
          docker build -t ${FULL_IMAGE_TAG} -t ${LATEST_TAG} .
          docker push ${FULL_IMAGE_TAG}
          docker push ${LATEST_TAG}
          
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create resource group if it doesn't exist
        run: |
          az group create \
            --name ${{ env.MCP_RESOURCE_GROUP }} \
            --location swedencentral \
            --tags Environment=dev Project=Azure-SRE-Demo-Manager ManagedBy=GitHub-Actions

      - name: Deploy Bicep Template
        id: deploy
        run: |
          # Get ACR name from hub resource group
          ACR_NAME=$(az acr list --resource-group rg-parking-hub-dev --query "[0].name" -o tsv)
          
          DEPLOYMENT_OUTPUT=$(az deployment group create \
            --resource-group ${{ env.MCP_RESOURCE_GROUP }} \
            --template-file infrastructure/modules/berlin-mcp-server.bicep \
            --parameters \
              location=swedencentral \
              environment=dev \
              containerImage=$ACR_NAME.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }} \
              containerRegistry=$ACR_NAME.azurecr.io \
              acrName=$ACR_NAME \
              berlinApiUrl=https://ca-parking-berlin.braveocean-195c6009.swedencentral.azurecontainerapps.io \
            --query properties.outputs \
            --output json)
          
          MCP_URL=$(echo $DEPLOYMENT_OUTPUT | jq -r '.containerAppUrl.value')
          echo "mcpServerUrl=$MCP_URL" >> $GITHUB_OUTPUT

      - name: Deployment summary
        run: |
          echo "### Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **MCP Server URL**: ${{ steps.deploy.outputs.mcpServerUrl }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Resource Group**: ${{ env.MCP_RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Resources Created:" >> $GITHUB_STEP_SUMMARY
          echo "- Container App Environment: \`cae-berlin-mcp\`" >> $GITHUB_STEP_SUMMARY
          echo "- Container App: \`ca-berlin-mcp\`" >> $GITHUB_STEP_SUMMARY
          echo "- Log Analytics Workspace: \`law-berlin-mcp\`" >> $GITHUB_STEP_SUMMARY
          echo "- Application Insights: \`ai-berlin-mcp\`" >> $GITHUB_STEP_SUMMARY
