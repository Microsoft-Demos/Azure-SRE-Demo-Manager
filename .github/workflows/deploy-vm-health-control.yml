name: Deploy VM Health Control to Azure Container App

on:
  push:
    branches:
      - main
    paths:
      - 'backend/vm-health-control/**'
      - '.github/actions/verify-container-app/**'
      - '.github/workflows/deploy-vm-health-control.yml'
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
  CONTAINER_APP_NAME: ${{ vars.VM_HEALTH_CONTROL_CONTAINER_APP_NAME }}
  RESOURCE_GROUP: ${{ vars.CHAOS_CONTROL_RESOURCE_GROUP }}
  IMAGE_NAME: vm-health-control

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_APP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY"

      - name: Build and push Docker image
        working-directory: backend/vm-health-control
        run: |
          IMAGE_TAG="${AZURE_CONTAINER_REGISTRY}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}"
          IMAGE_TAG_LATEST="${AZURE_CONTAINER_REGISTRY}.azurecr.io/${IMAGE_NAME}:latest"

          docker build -t "$IMAGE_TAG" -t "$IMAGE_TAG_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_TAG_LATEST"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_TAG"

      - name: Verify Container App revision
        uses: ./.github/actions/verify-container-app
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          app-name: ${{ env.CONTAINER_APP_NAME }}

      - name: Deployment summary
        run: |
          APP_URL=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "## VM Health Control Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: https://$APP_URL" >> "$GITHUB_STEP_SUMMARY"
